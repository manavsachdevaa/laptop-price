
name: Laptop Price Prediction CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t laptop-price-api .

      - name: Run Docker container
        run: docker run -d --name laptop-price-container -p 8000:8000 laptop-price-api

      - name: Test health endpoint
        run: |
          for i in {1..15}; do
            if curl -fsS http://localhost:8000/health; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          docker logs laptop-price-container
          exit 1

      - name: Test prediction endpoint
        run: |
          curl -fsS -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"Company":"Apple","TypeName":"Ultrabook","Inches":13.3,"ScreenResolution":"IPS Panel Retina Display 2560x1600","Cpu":"Intel Core i5 2.3GHz","Ram_GB":8,"Memory":"128GB SSD","Gpu":"Intel Iris Plus Graphics 640","OpSys":"macOS","Weight_kg":1.37}' \
            -o prediction.json

          python -c "import json; d=json.load(open('prediction.json')); assert d['predicted_price_euros'] > 0; assert d['currency'] == 'EUR'; print('Prediction passed:', d)"

      - name: Show Docker logs
        if: always()
        run: docker logs laptop-price-container || true

      - name: Remove Docker container
        if: always()
        run: docker rm -f laptop-price-container || true
